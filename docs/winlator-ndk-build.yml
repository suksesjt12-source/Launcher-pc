# Template GitHub Actions untuk Build APK Winlator NDK (Salin ke .github/workflows/ di repo fork Winlator Anda)
name: Build Winlator Mali NDK APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-winlator-ndk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK, NDK & CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Verify embedded runtime rootfs
        run: |
          if [ ! -f app/src/main/assets/imagefs.txz ]; then
            echo "::warning::app/src/main/assets/imagefs.txz tidak ditemukan. Pastikan rootfs Wine/Box64 sudah tersedia sebelum rilis."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK (Native NDK + Compose Launcher)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --max-workers=2

      - name: Upload Merged APK
        uses: actions/upload-artifact@v4
        with:
          name: stormrev-winlator-mali-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
