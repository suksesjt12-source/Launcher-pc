
name: Android APK Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate project
        run: |
          test -f ./gradlew || {
            echo "Gradle wrapper missing"
            exit 1
          }
          test -f settings.gradle -o -f settings.gradle.kts || {
            echo "Gradle settings missing"
            exit 1
          }
          chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-pc-debug-apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 14
